name: projectslatte-litellm

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: projectslatte/litellm-postgres:18.6-trixie-pgbackrest-2.55.1
    environment:
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: litellm
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=litellm archive-push %p
      - -c
      - wal_level=replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${LITELLM_BACKUP_DIR:-${HOME}/.local/share/projectslatte/litellm-backups}
        target: /var/lib/pgbackrest

  proxy:
    image: ghcr.io/berriai/litellm:v1.102.1
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/proxy-entrypoint"]
    command:
      - litellm
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    ports:
      - 127.0.0.1:4000:4000
    secrets:
      - litellm_master_key
      - litellm_salt_key
      - postgres_password
      - openrouter_api_key
    volumes:
      - ./bin/proxy-entrypoint:/usr/local/bin/proxy-entrypoint:ro
      - ./config.yaml:/app/config.yaml:ro

secrets:
  litellm_master_key:
    environment: LITELLM_MASTER_KEY
  litellm_salt_key:
    environment: LITELLM_SALT_KEY
  postgres_password:
    environment: POSTGRES_PASSWORD
  openrouter_api_key:
    environment: OPENROUTER_API_KEY

volumes:
  postgres-data:
