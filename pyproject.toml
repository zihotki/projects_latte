[project]
name = "projectslatte"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pyright==1.1.403",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".local", ".pnpm-store", "cut_on_eight/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = [".local", ".pnpm-store", ".venv", "cut_on_eight/node_modules"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["python/tests"]
